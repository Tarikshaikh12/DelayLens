[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "delaylens"
version = "1.0.0"
description = "Approval-time delivery delay prediction with honest temporal evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0",
  "scipy==1.16.3", "joblib==1.5.3", "threadpoolctl==3.6.0",
  "fastapi==0.115.12", "pydantic==2.13.5", "uvicorn==0.34.2"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "matplotlib==3.10.8", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
